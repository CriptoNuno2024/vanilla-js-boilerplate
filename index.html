<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YoshiCat e a Quinta do Moscatel</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
      min-height: 100vh;
      background-image: url('Yoshi_Cat.jpg');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      text-align: center;
      padding-bottom: 20px;
    }

    h1 {
      font-size: 24px;
      color: #f5d76e;
      margin-bottom: 8px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    .subtitle {
      font-size: 15px;
      color: #eee;
      margin-bottom: 28px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      margin: 12px 0;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f5d76e, #d4a017);
      color: #1a1a1a;
    }

    .btn-secondary {
      background: rgba(30, 30, 30, 0.85);
      color: white;
      border: 1px solid #555;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <div class="content">
    <h1>YoshiCat e a Quinta do Moscatel</h1>
    <p class="subtitle">Protege a vinha. Faz o melhor Moscatel.</p>

    <button class="btn btn-primary" onclick="entrarNaQuinta()">
      Entrar na Quinta
    </button>

    <button class="btn btn-secondary" onclick="escolherLingua()">
      Escolher Língua
    </button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function entrarNaQuinta() {
      tg.showAlert("Em breve vais entrar na Quinta!");
    }

    function escolherLingua() {
      tg.showAlert("Escolha de língua em desenvolvimento.");
    }
  </script>
</body>
</html>
