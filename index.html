<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YoshiCat e a Quinta do Moscatel</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
      min-height: 100vh;
      background-image: url('Yoshi_Cat.jpg');
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 24px 16px;
      position: relative;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to top,
        rgba(0,0,0,0.92) 0%,
        rgba(0,0,0,0.55) 35%,
        rgba(0,0,0,0.15) 70%,
        rgba(0,0,0,0.05) 100%
      );
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      text-align: center;
    }

    h1 {
      font-size: 26px;
      color: #f5d76e;
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      line-height: 1.3;
    }

    .subtitle {
      font-size: 16px;
      color: #f0f0f0;
      margin-bottom: 28px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
    }

    .btn {
      display: block;
      width: 100%;
      padding: 18px;
      margin: 12px 0;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f5d76e, #d4a017);
      color: #1a1a1a;
    }

    .btn-secondary {
      background: rgba(25, 25, 25, 0.9);
      color: white;
      border: 1px solid #666;
    }

    /* Ajustes para ecrãs maiores (PC) */
    @media (min-width: 600px) {
      body {
        background-position: center center;
        justify-content: center;
        padding: 40px;
      }

      .content {
        background: rgba(0,0,0,0.65);
        padding: 30px 25px;
        border-radius: 20px;
        backdrop-filter: blur(6px);
      }

      h1 {
        font-size: 28px;
      }

      .btn {
        font-size: 18px;
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <div class="content">
    <h1>YoshiCat e a Quinta do Moscatel</h1>
    <p class="subtitle">Protege a vinha. Faz o melhor Moscatel.</p>

    <button class="btn btn-primary" onclick="entrarNaQuinta()">
      Entrar na Quinta
    </button>

    <button class="btn btn-secondary" onclick="escolherLingua()">
      Escolher Língua
    </button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function entrarNaQuinta() {
      tg.showAlert("Em breve vais entrar na Quinta!");
    }

    function escolherLingua() {
      tg.showAlert("Escolha de língua em desenvolvimento.");
    }
  </script>
</body>
</html>
