<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YoshiCat e a Quinta do Moscatel</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
      min-height: 100vh;
      background-image: url('Yoshi_Cat.jpg');
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
      background-color: #0a1226;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 24px 16px;
      position: relative;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to top,
        rgba(0,0,0,0.68) 0%,
        rgba(0,0,0,0.35) 40%,
        rgba(0,0,0,0.08) 75%,
        rgba(0,0,0,0) 100%
      );
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      text-align: center;
    }

    /* Ecrãs do jogo: só o ecrã ativo fica visível */
    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    h1 {
      font-size: 26px;
      color: #f5d76e;
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      line-height: 1.3;
    }

    h2 {
      font-size: 21px;
      color: #f5d76e;
      margin-bottom: 10px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      line-height: 1.3;
    }

    .subtitle {
      font-size: 16px;
      color: #f0f0f0;
      margin-bottom: 28px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
    }

    .btn {
      display: block;
      width: 100%;
      padding: 18px;
      margin: 12px 0;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f5d76e, #d4a017);
      color: #1a1a1a;
    }

    .btn-secondary {
      background: rgba(25, 25, 25, 0.9);
      color: white;
      border: 1px solid #666;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Barra de estatísticas (Uvas, Gotas, Reputação, Garrafas) */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(245, 215, 110, 0.4);
      border-radius: 14px;
      padding: 12px 10px;
      margin-bottom: 22px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 60px;
      flex: 1;
    }

    .stat-icon {
      font-size: 18px;
    }

    .stat-value {
      font-weight: 700;
      color: #f5d76e;
      font-size: 15px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }

    .stat-label {
      font-size: 10px;
      color: #ddd;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .info-text {
      font-size: 14px;
      color: #eee;
      margin-bottom: 18px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
      line-height: 1.4;
    }

    .game-subtitle {
      font-size: 13px;
      color: #f5d76e;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }

    .game-question {
      font-size: 16px;
      color: #fff;
      margin-bottom: 18px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
      line-height: 1.4;
    }

    .game-result {
      font-size: 14px;
      color: #f0f0f0;
      margin-bottom: 10px;
    }

    .choice-list .btn {
      text-align: left;
      padding-left: 22px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 18px 0;
    }

    .option-card {
      background: rgba(25, 25, 25, 0.85);
      border: 1px solid #666;
      border-radius: 14px;
      padding: 26px 10px;
      font-size: 32px;
      cursor: pointer;
      text-align: center;
      transition: transform 0.1s ease;
    }

    .option-card:active {
      transform: scale(0.94);
    }

    .option-card .option-label {
      font-size: 12px;
      color: #ddd;
      margin-top: 6px;
    }

    .rps-row {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 20px 0;
    }

    .rps-btn {
      font-size: 30px;
      background: rgba(25, 25, 25, 0.85);
      border: 1px solid #666;
      border-radius: 50%;
      width: 68px;
      height: 68px;
      cursor: pointer;
    }

    .rps-btn:active {
      transform: scale(0.92);
    }

    .progress-bar-outer {
      width: 100%;
      height: 16px;
      background: rgba(25, 25, 25, 0.85);
      border: 1px solid #666;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress-bar-inner {
      height: 100%;
      background: linear-gradient(135deg, #f5d76e, #d4a017);
      width: 0%;
      transition: width 0.3s ease;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }

    .profile-card {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(245, 215, 110, 0.4);
      border-radius: 14px;
      padding: 18px 10px;
    }

    .profile-card .stat-icon {
      font-size: 26px;
      margin-bottom: 6px;
    }

    .profile-card .stat-value {
      font-size: 20px;
    }

    .story-box {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(245, 215, 110, 0.4);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      font-size: 15px;
      line-height: 1.5;
      color: #f0f0f0;
      text-align: left;
      min-height: 90px;
    }

    /* Fase atual da Vinha */
    .phase-card {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(245, 215, 110, 0.4);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: left;
    }

    .phase-nome {
      font-size: 17px;
      font-weight: 700;
      color: #f5d76e;
      margin-bottom: 6px;
    }

    .phase-desc {
      font-size: 14px;
      color: #f0f0f0;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .phase-progress {
      font-size: 13px;
      color: #ddd;
    }

    .cooldown-suffix {
      font-size: 12px;
      opacity: 0.8;
      margin-left: 4px;
    }

    /* Enciclopédia do Moscatel */
    .encyclopedia-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin: 16px 0;
      text-align: left;
      max-height: 48vh;
      overflow-y: auto;
    }

    .encyclopedia-card {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(245, 215, 110, 0.4);
      border-radius: 14px;
      padding: 14px 16px;
    }

    .encyclopedia-card h3 {
      color: #f5d76e;
      font-size: 15px;
      margin-bottom: 6px;
    }

    .encyclopedia-card p {
      font-size: 13px;
      color: #f0f0f0;
      line-height: 1.4;
    }

    .encyclopedia-card.locked {
      opacity: 0.45;
      border-style: dashed;
    }

    .encyclopedia-card.locked h3 {
      color: #aaa;
    }

    /* Título especial e galeria de garrafas (Perfil) */
    .badge-title {
      background: linear-gradient(135deg, #f5d76e, #d4a017);
      color: #1a1a1a;
      font-weight: 700;
      font-size: 14px;
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 18px;
    }

    .bottle-gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 20px;
      font-size: 24px;
    }

    /* Ajustes para ecrãs maiores (PC) */
    @media (min-width: 600px) {
      body {
        background-image: none;  /* as duas camadas abaixo tratam disto agora */
        justify-content: center;
        padding: 40px;
      }

      /* Camada desfocada — preenche os lados, sem barras sólidas */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url('Yoshi_Cat.jpg');
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
        filter: blur(45px) brightness(0.55);
        transform: scale(1.15);
        z-index: 0;
      }

      /* Camada nítida — a imagem inteira, sem cortes, por cima da desfocada */
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url('Yoshi_Cat.jpg');
        background-repeat: no-repeat;
        background-position: center;
        background-size: contain;
        z-index: 0;
      }

      .content {
        background: rgba(0,0,0,0.65);
        padding: 30px 25px;
        border-radius: 20px;
        backdrop-filter: blur(6px);
        max-height: 85vh;
        overflow-y: auto;
      }

      h1 {
        font-size: 28px;
      }

      .btn {
        font-size: 18px;
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <!-- ECRÃ INICIAL (mantido tal como estava) -->
  <div id="screen-home" class="screen content active">
    <h1 data-i18n="home.title">YoshiCat e a Quinta do Moscatel</h1>
    <p class="subtitle" data-i18n="home.subtitle">Protege a vinha. Faz o melhor Moscatel.</p>

    <button class="btn btn-primary" onclick="goTo('quinta')" data-i18n="home.btnEntrar">
      Entrar na Quinta
    </button>

    <button class="btn btn-secondary" onclick="goTo('lingua')" data-i18n="home.btnLingua">
      Escolher Língua
    </button>
  </div>

  <!-- ECRÃ HUB: A QUINTA -->
  <div id="screen-quinta" class="screen content">
    <h1 data-i18n="hub.title">A Quinta do Moscatel</h1>

    <div class="stats-bar">
      <div class="stat-item">
        <span class="stat-icon">🍇</span>
        <span class="stat-value val-uvas">0</span>
        <span class="stat-label" data-i18n="stat.uvas">Uvas</span>
      </div>
      <div class="stat-item">
        <span class="stat-icon">💧</span>
        <span class="stat-value val-gotas">0</span>
        <span class="stat-label" data-i18n="stat.gotas">Gotas</span>
      </div>
      <div class="stat-item">
        <span class="stat-icon">⭐</span>
        <span class="stat-value val-reputacao">0</span>
        <span class="stat-label" data-i18n="stat.reputacao">Reputação</span>
      </div>
      <div class="stat-item">
        <span class="stat-icon">🍾</span>
        <span class="stat-value val-garrafas">0</span>
        <span class="stat-label" data-i18n="stat.garrafas">Garrafas</span>
      </div>
    </div>

    <button class="btn btn-primary" onclick="goTo('vinha')" data-i18n="hub.btnVinha">🌱 Tratar a Vinha</button>
    <button class="btn btn-primary" onclick="goTo('proteger')" data-i18n="hub.btnProteger">🛡️ Proteger a Quinta</button>
    <button class="btn btn-secondary" onclick="goTo('garrafa')" data-i18n="hub.btnGarrafa">🍾 Criar Garrafa</button>
    <button class="btn btn-secondary" onclick="goTo('explorar')" data-i18n="hub.btnExplorar">📖 Explorar</button>
    <button class="btn btn-secondary" onclick="goTo('perfil')" data-i18n="hub.btnPerfil">👤 Perfil</button>
    <button class="btn btn-secondary" onclick="goTo('home')" data-i18n="hub.btnSair">⬅ Sair da Quinta</button>
  </div>

  <!-- ECRÃ: A VINHA (ciclo de trabalho agrícola) -->
  <div id="screen-vinha" class="screen content">
    <div id="vinha-container"></div>
    <button class="btn btn-secondary" onclick="goTo('quinta')" data-i18n="nav.voltarQuinta">⬅ Voltar à Quinta</button>
  </div>

  <!-- ECRÃ: PROTEGER A QUINTA (mantido tal como estava; conteúdo gerado por JS) -->
  <div id="screen-proteger" class="screen content">
    <div id="proteger-container"></div>
    <button class="btn btn-secondary" onclick="goTo('quinta')" data-i18n="nav.voltarQuinta">⬅ Voltar à Quinta</button>
  </div>

  <!-- ECRÃ: CRIAR GARRAFA (com pequena sequência narrativa) -->
  <div id="screen-garrafa" class="screen content">
    <div id="garrafa-container"></div>
    <button class="btn btn-secondary" onclick="goTo('quinta')" data-i18n="nav.voltarQuinta">⬅ Voltar à Quinta</button>
  </div>

  <!-- ECRÃ: EXPLORAR (desbloqueia uma entrada da Enciclopédia de cada vez) -->
  <div id="screen-explorar" class="screen content">
    <div id="explorar-container"></div>
    <button class="btn btn-secondary" onclick="goTo('quinta')" data-i18n="nav.voltarQuinta">⬅ Voltar à Quinta</button>
  </div>

  <!-- ECRÃ: ENCICLOPÉDIA DO MOSCATEL (galeria de entradas desbloqueadas/bloqueadas) -->
  <div id="screen-enciclopedia" class="screen content">
    <div id="enciclopedia-container"></div>
    <button class="btn btn-secondary" onclick="goTo('quinta')" data-i18n="nav.voltarQuinta">⬅ Voltar à Quinta</button>
  </div>

  <!-- ECRÃ: PERFIL -->
  <div id="screen-perfil" class="screen content">
    <h2 data-i18n="perfil.title">Perfil</h2>
    <div id="perfil-container"></div>
    <button class="btn btn-secondary" onclick="goTo('quinta')" data-i18n="nav.voltarQuinta">⬅ Voltar à Quinta</button>
  </div>

  <!-- ECRÃ: ESCOLHER LÍNGUA -->
  <div id="screen-lingua" class="screen content">
    <h2 data-i18n="lingua.title">Escolher Língua</h2>
    <p class="info-text" data-i18n="lingua.subtitle">Escolhe o idioma da interface.</p>
    <button class="btn btn-secondary" onclick="selecionarLingua('pt')" data-i18n="lingua.pt">🇵🇹 Português</button>
    <button class="btn btn-secondary" onclick="selecionarLingua('en')" data-i18n="lingua.en">🇬🇧 English</button>
    <button class="btn btn-secondary" onclick="selecionarLingua('es')" data-i18n="lingua.es">🇪🇸 Español</button>
    <button class="btn btn-secondary" onclick="goTo('home')" data-i18n="nav.voltar">⬅ Voltar</button>
  </div>

  <!--
    Módulos JS (ordem importa: state e i18n primeiro, main por último).
    O "?v=" é só para invalidar a cache do browser a cada alteração — sem
    isto, um browser (ou o GitHub Pages) pode continuar a servir uma
    versão antiga de um destes ficheiros depois de um novo deploy, o que
    pareceria bugs de inconsistência (ex: idioma trocado só em parte).
    Sobe este número sempre que editares algum ficheiro em js/.
  -->
  <script src="js/state.js?v=5"></script>
  <script src="js/i18n.js?v=5"></script>
  <script src="js/vinha.js?v=5"></script>
  <script src="js/explorar.js?v=5"></script>
  <script src="js/proteger.js?v=5"></script>
  <script src="js/garrafa.js?v=5"></script>
  <script src="js/perfil.js?v=5"></script>
  <script src="js/main.js?v=5"></script>
</body>
</html>
