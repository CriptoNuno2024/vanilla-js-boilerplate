<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YoshiCat e a Quinta do Moscatel</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0a0a0a;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .hero-image {
      width: 100%;
      border-radius: 18px;
      margin-bottom: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: block;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #f5d76e;
      line-height: 1.3;
    }

    .subtitle {
      font-size: 15px;
      color: #ccc;
      margin-bottom: 28px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      margin: 12px 0;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f5d76e, #d4a017);
      color: #1a1a1a;
    }

    .btn-secondary {
      background: #2a2a2a;
      color: white;
      border: 1px solid #444;
    }

    .btn:active {
      transform: scale(0.97);
    }

    /* Melhor visualização em ecrãs maiores */
    @media (min-width: 600px) {
      .container {
        max-width: 420px;
      }
      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="Yoshi_Cat.jpg" alt="YoshiCat na Quinta" class="hero-image">

    <h1>YoshiCat e a Quinta do Moscatel</h1>
    <p class="subtitle">Protege a vinha. Faz o melhor Moscatel.</p>

    <button class="btn btn-primary" onclick="entrarNaQuinta()">
      Entrar na Quinta
    </button>

    <button class="btn btn-secondary" onclick="escolherLingua()">
      Escolher Língua
    </button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function entrarNaQuinta() {
      tg.showAlert("Em breve vais entrar na Quinta!");
    }

    function escolherLingua() {
      tg.showAlert("Escolha de língua em desenvolvimento.");
    }
  </script>
</body>
</html>
