<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YoshiCat e a Quinta do Moscatel</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
      min-height: 100vh;
      background-color: #0a1226;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 16px 10px;
      position: relative;
      --barra-home: calc(76px + env(safe-area-inset-bottom, 0px));
      /* Coluna do jogo: largura de telemóvel, também no PC */
      --coluna: min(100vw, 480px);
    }

    /* -----------------------------------------------------------------
       FUNDOS (definidos em definirFundo() no js/main.js)
       - modo-capa: ecrã inicial, capa inteira visível + versão desfocada
         a preencher os lados/baixo, sem cortes.
       - modo-paisagem: a parte de cima da capa (céu, lua, casa e vinha,
         até 59% da altura — o YoshiCat começa a 61%), inteira na coluna.
       - modo-foto: uma imagem da história (Vinha e Criar Garrafa),
         inteira na largura da coluna, presa ao topo.
       Nos modos paisagem e foto, a camada desfocada é a mesma imagem,
       escura, a preencher o resto do ecrã e os lados no PC.
       ----------------------------------------------------------------- */
    #fundo {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background-color: #0a1226;
    }

    #fundo > div {
      position: absolute;
      inset: 0;
      background-repeat: no-repeat;
    }

    #fundo .fundo-desfocado {
      background-size: cover;
      background-position: center;
      filter: blur(28px) brightness(0.4);
      transform: scale(1.15);
    }

    #fundo.modo-capa .fundo-desfocado {
      background-image: url('Yoshi_Cat.jpg');
    }

    #fundo.modo-capa .fundo-nitido {
      background-image: url('Yoshi_Cat.jpg');
      background-size: contain;
      background-position: center bottom;
      bottom: var(--barra-home);
    }

    /* Desfocada da paisagem: só a parte de cima da capa, sem o gato */
    #fundo.modo-paisagem .fundo-desfocado {
      background-image: url('Yoshi_Cat.jpg');
      background-position: center top;
      bottom: auto;
      height: 170vh;
    }

    /* Caixa da foto: MESMA regra em todos os ecrãs (menos o inicial) —
       mesma altura, proporcional à largura da coluna. A foto preenche a
       caixa toda (background-size: cover) e o que sobra é cortado, em
       vez de a foto encolher para caber. Por isso todas as fotos ficam
       do mesmo tamanho, seja qual for a proporção original de cada uma. */
    #fundo.modo-paisagem .fundo-nitido,
    #fundo.modo-foto .fundo-nitido {
      left: 50%;
      right: auto;
      bottom: auto;
      width: var(--coluna);
      height: calc(var(--coluna) * 0.95);
      transform: translateX(-50%);
      background-size: cover;
      background-position: center top;
      -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 60px), transparent 100%);
      mask-image: linear-gradient(to bottom, #000 calc(100% - 60px), transparent 100%);
    }

    #fundo.modo-paisagem .fundo-nitido {
      background-image: url('Yoshi_Cat.jpg');
    }

    /* Escurecimento leve só na parte de baixo, onde fica a janela */
    .overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0,0,0,0.45) 0%,
        rgba(0,0,0,0.1) 35%,
        rgba(0,0,0,0) 55%
      );
      z-index: 1;
    }

    /* -----------------------------------------------------------------
       JANELA DOS ECRÃS (todos menos o inicial): encostada em baixo,
       semitransparente, para se ver a cena por cima dela
       ----------------------------------------------------------------- */
    .screen.content:not(#screen-home) {
      background: rgba(10, 12, 20, 0.45);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(245, 215, 110, 0.25);
      border-radius: 18px;
      padding: 12px 12px 6px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }

    .screen:not(#screen-home) .btn {
      padding: 11px;
      margin: 7px 0;
      font-size: 16px;
      text-shadow: none;
    }

    .screen:not(#screen-home) .choice-list .btn {
      padding-left: 18px;
    }

    .screen:not(#screen-home) h2 {
      font-size: 19px;
      margin-bottom: 6px;
    }

    .game-subtitle {
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }

    .game-result:empty {
      display: none;
    }

    /* No ecrã inicial a capa fica limpa, sem escurecimento */
    body.tela-home .overlay {
      display: none;
    }

    /* Texto que continua na página (para leitores de ecrã) mas não se vê */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* Ecrã inicial: botões pequenos, lado a lado, na faixa de baixo */
    body.tela-home {
      padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    }

    .home-botoes {
      display: flex;
      gap: 10px;
    }

    .home-botoes .btn {
      flex: 1;
      margin: 0;
      padding: 11px 8px;
      font-size: 15px;
      border-radius: 12px;
    }

    .home-botoes .btn-secondary {
      background: rgba(15, 15, 20, 0.7);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      text-align: center;
    }

    /* Ecrãs do jogo: só o ecrã ativo fica visível */
    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    h1 {
      font-size: 26px;
      color: #f5d76e;
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      line-height: 1.3;
    }

    h2 {
      font-size: 21px;
      color: #f5d76e;
      margin-bottom: 10px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      line-height: 1.3;
    }

    .subtitle {
      font-size: 16px;
      color: #f0f0f0;
      margin-bottom: 28px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
    }

    .btn {
      display: block;
      width: 100%;
      padding: 18px;
      margin: 12px 0;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f5d76e, #d4a017);
      color: #1a1a1a;
    }

    .btn-secondary {
      background: rgba(20, 20, 26, 0.7);
      color: white;
      border: 1px solid #666;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Barra de estatísticas (Uvas, Gotas, Reputação, Garrafas) */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      background: rgba(12, 14, 22, 0.55);
      border: 1px solid rgba(245, 215, 110, 0.4);
      border-radius: 14px;
      padding: 7px 8px;
      margin-bottom: 10px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 60px;
      flex: 1;
    }

    .stat-icon {
      font-size: 18px;
    }

    .stat-value {
      font-weight: 700;
      color: #f5d76e;
      font-size: 15px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }

    .stat-label {
      font-size: 10px;
      color: #ddd;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .info-text {
      font-size: 14px;
      color: #eee;
      margin-bottom: 18px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
      line-height: 1.4;
    }

    .game-subtitle {
      font-size: 13px;
      color: #f5d76e;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }

    .game-question {
      font-size: 16px;
      color: #fff;
      margin-bottom: 18px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
      line-height: 1.4;
    }

    .game-result {
      font-size: 14px;
      color: #f0f0f0;
      margin-bottom: 10px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.95);
    }

    .choice-list .btn {
      text-align: left;
      padding-left: 22px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 18px 0;
    }

    .option-card {
      background: rgba(20, 20, 26, 0.65);
      border: 1px solid #666;
      border-radius: 14px;
      padding: 16px 8px;
      font-size: 28px;
      cursor: pointer;
      text-align: center;
      transition: transform 0.1s ease;
    }

    .option-card:active {
      transform: scale(0.94);
    }

    .option-card .option-label {
      font-size: 12px;
      color: #ddd;
      margin-top: 6px;
    }

    .rps-row {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 20px 0;
    }

    .rps-btn {
      font-size: 30px;
      background: rgba(20, 20, 26, 0.65);
      border: 1px solid #666;
      border-radius: 50%;
      width: 68px;
      height: 68px;
      cursor: pointer;
    }

    .rps-btn:active {
      transform: scale(0.92);
    }

    .progress-bar-outer {
      width: 100%;
      height: 16px;
      background: rgba(20, 20, 26, 0.65);
      border: 1px solid #666;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress-bar-inner {
      height: 100%;
      background: linear-gradient(135deg, #f5d76e, #d4a017);
      width: 0%;
      transition: width 0.3s ease;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }

    .profile-card {
      background: rgba(12, 14, 22, 0.55);
      border: 1px solid rgba(245, 215, 110, 0.4);
      border-radius: 14px;
      padding: 18px 10px;
    }

    .profile-card .stat-icon {
      font-size: 26px;
      margin-bottom: 6px;
    }

    .profile-card .stat-value {
      font-size: 20px;
    }

    .story-box {
      background: rgba(12, 14, 22, 0.55);
      border: 1px solid rgba(245, 215, 110, 0.4);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      font-size: 15px;
      line-height: 1.5;
      color: #f0f0f0;
      text-align: left;
      min-height: 90px;
    }

    /* Vinha (telemóvel e PC): tudo mais compacto, para caber no ecrã sem
       deslizar e deixar ver mais da foto de fundo */
    #screen-vinha h2 { font-size: 19px; margin-bottom: 6px; }
    #screen-vinha .phase-card { padding: 10px 12px; margin-bottom: 8px; }
    #screen-vinha .phase-nome { font-size: 15px; margin-bottom: 3px; }
    #screen-vinha .phase-desc { font-size: 13px; line-height: 1.35; margin-bottom: 4px; }
    #screen-vinha .stats-bar { padding: 6px 10px; margin-bottom: 8px; }
    #screen-vinha .stat-item { flex-direction: row; justify-content: center; gap: 6px; }
    #screen-vinha .stat-icon { font-size: 16px; }
    #screen-vinha .game-result { font-size: 13px; line-height: 1.35; margin-bottom: 4px; }
    #screen-vinha .game-subtitle { font-size: 12px; margin-bottom: 4px; }
    #screen-vinha .story-box { padding: 10px 12px; margin-bottom: 8px; font-size: 13px; line-height: 1.35; }

    /* Adega (dentro de "Criar Garrafa") no telemóvel: mesma compactação
       da Vinha, e a notícia da Enciclopédia (.story-box) mais pequena,
       porque aqui pode aparecer junto com o cartão da Cave e 3 botões */
    #screen-garrafa h2 { font-size: 19px; margin-bottom: 6px; }
    #screen-garrafa .phase-card { padding: 10px 12px; margin-bottom: 8px; }
    #screen-garrafa .phase-nome { font-size: 15px; margin-bottom: 3px; }
    #screen-garrafa .phase-desc { font-size: 13px; line-height: 1.35; margin-bottom: 4px; }
    #screen-garrafa .phase-progress { font-size: 12px; }
    /* 4 recursos nesta barra (Uvas, Gotas, Bagaço, Aguardente) — mantém a
       disposição em coluna (ícone/valor/etiqueta), que já funciona bem
       com 4 colunas estreitas no Menu da Quinta; só encolhe um pouco. */
    #screen-garrafa .stats-bar { padding: 8px 4px; margin-bottom: 8px; }
    #screen-garrafa .stat-icon { font-size: 15px; }
    #screen-garrafa .stat-value { font-size: 14px; }
    #screen-garrafa .stat-label { font-size: 9px; }
    #screen-garrafa .game-result { font-size: 13px; line-height: 1.35; margin-bottom: 4px; }
    #screen-garrafa .game-subtitle { font-size: 12px; margin-bottom: 4px; }
    #screen-garrafa .story-box { padding: 10px 12px; margin-bottom: 8px; font-size: 13px; line-height: 1.35; }

    /* Perfil no telemóvel: 3 colunas de cartões mais compactos, para caber
       mesmo com a galeria de garrafas e o título especial */
    @media (max-width: 599px) {
      .profile-grid { grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
      .profile-card { padding: 10px 4px; }
      .profile-card .stat-icon { font-size: 20px; margin-bottom: 2px; }
      .profile-card .stat-value { font-size: 17px; }
      #perfil-container .bottle-gallery { font-size: 20px; margin-bottom: 12px; }
      #screen-perfil h2 { margin-bottom: 6px; }
      #perfil-container .info-text { margin-bottom: 10px; }
      #perfil-container .badge-title { margin-bottom: 10px; }
    }

    /* Fase atual da Vinha */
    .phase-card {
      background: rgba(12, 14, 22, 0.55);
      border: 1px solid rgba(245, 215, 110, 0.4);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: left;
    }

    .phase-nome {
      font-size: 17px;
      font-weight: 700;
      color: #f5d76e;
      margin-bottom: 6px;
    }

    .phase-desc {
      font-size: 14px;
      color: #f0f0f0;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .phase-progress {
      font-size: 13px;
      color: #ddd;
    }

    .cooldown-suffix {
      font-size: 12px;
      opacity: 0.8;
      margin-left: 4px;
    }

    /* Vantagem da estação, junto ao nome do botão (Parte A das estações) */
    .bonus-suffix {
      font-size: 12px;
      opacity: 0.95;
      margin-left: 4px;
      color: #d7ffb8;
      font-weight: 700;
    }

    /* Linha "Outono · Setembro — época de vindima" no Menu da Quinta */
    .estacao-linha {
      font-size: 14px;
      color: #f5d76e;
      margin-bottom: 16px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
    }

    /* Enciclopédia do Moscatel */
    .encyclopedia-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin: 16px 0;
      text-align: left;
      max-height: 48vh;
      overflow-y: auto;
    }

    .encyclopedia-card {
      background: rgba(12, 14, 22, 0.55);
      border: 1px solid rgba(245, 215, 110, 0.4);
      border-radius: 14px;
      padding: 14px 16px;
    }

    .encyclopedia-card h3 {
      color: #f5d76e;
      font-size: 15px;
      margin-bottom: 6px;
    }

    .encyclopedia-card p {
      font-size: 13px;
      color: #f0f0f0;
      line-height: 1.4;
    }

    .encyclopedia-card.locked {
      opacity: 0.45;
      border-style: dashed;
    }

    .encyclopedia-card.locked h3 {
      color: #aaa;
    }

    /* Título especial e galeria de garrafas (Perfil) */
    .badge-title {
      background: linear-gradient(135deg, #f5d76e, #d4a017);
      color: #1a1a1a;
      font-weight: 700;
      font-size: 14px;
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 18px;
    }

    .bottle-gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 20px;
      font-size: 24px;
    }

    /* Ajustes para ecrãs maiores (PC) */
    @media (min-width: 600px) {
      /* Janela encostada em baixo, dentro da coluna, como no telemóvel */
      body {
        justify-content: flex-end;
        padding: 0 40px 20px;
      }

      /* Ecrã inicial: botões em baixo, sem quadro por cima da capa */
      body.tela-home {
        padding: 0 40px calc(18px + env(safe-area-inset-bottom, 0px));
      }

      #screen-home.content {
        max-width: 360px;
      }

      .content {
        max-width: 440px;
        max-height: 85vh;
        overflow-y: auto;
      }

      h1 {
        font-size: 28px;
      }

      .btn {
        font-size: 18px;
        padding: 16px;
      }
    }
  </style>
</head>
<body class="tela-home">
  <!-- Fundo (capa, paisagem ou foto da história) — ver definirFundo() -->
  <div id="fundo" class="modo-capa">
    <div class="fundo-desfocado"></div>
    <div class="fundo-nitido"></div>
  </div>
  <div class="overlay"></div>

  <!-- ECRÃ INICIAL: a capa fica toda visível; o título já está no logótipo
       da capa, por isso fica só para leitores de ecrã -->
  <div id="screen-home" class="screen content active">
    <h1 class="sr-only" data-i18n="home.title">YoshiCat e a Quinta do Moscatel</h1>
    <p class="sr-only" data-i18n="home.subtitle">Protege a vinha. Faz o melhor Moscatel.</p>

    <div class="home-botoes">
      <button class="btn btn-primary" onclick="goTo('quinta')" data-i18n="home.btnEntrar">
        Entrar na Quinta
      </button>

      <button class="btn btn-secondary" onclick="goTo('lingua')" data-i18n="home.btnLingua">
        Escolher Língua
      </button>
    </div>
  </div>

  <!-- ECRÃ HUB: A QUINTA -->
  <div id="screen-quinta" class="screen content">
    <h1 data-i18n="hub.title">A Quinta do Moscatel</h1>
    <p id="estacao-linha" class="estacao-linha"></p>

    <div class="stats-bar">
      <div class="stat-item">
        <span class="stat-icon">🍇</span>
        <span class="stat-value val-uvas">0</span>
        <span class="stat-label" data-i18n="stat.uvas">Uvas</span>
      </div>
      <div class="stat-item">
        <span class="stat-icon">💧</span>
        <span class="stat-value val-gotas">0</span>
        <span class="stat-label" data-i18n="stat.gotas">Gotas</span>
      </div>
      <div class="stat-item">
        <span class="stat-icon">⭐</span>
        <span class="stat-value val-reputacao">0</span>
        <span class="stat-label" data-i18n="stat.reputacao">Reputação</span>
      </div>
      <div class="stat-item">
        <span class="stat-icon">🍾</span>
        <span class="stat-value val-garrafas">0</span>
        <span class="stat-label" data-i18n="stat.garrafas">Garrafas</span>
      </div>
    </div>

    <button class="btn btn-primary" onclick="goTo('vinha')" data-i18n="hub.btnVinha">🌱 Tratar a Vinha</button>
    <button class="btn btn-primary" onclick="goTo('proteger')" data-i18n="hub.btnProteger">🛡️ Proteger a Quinta</button>
    <button class="btn btn-secondary" onclick="goTo('garrafa')" data-i18n="hub.btnGarrafa">🍾 Criar Garrafa</button>
    <button class="btn btn-secondary" onclick="goTo('explorar')" data-i18n="hub.btnExplorar">📖 Explorar</button>
    <button class="btn btn-secondary" onclick="goTo('perfil')" data-i18n="hub.btnPerfil">👤 Perfil</button>
    <button class="btn btn-secondary" onclick="goTo('home')" data-i18n="hub.btnSair">⬅ Sair da Quinta</button>
  </div>

  <!-- ECRÃ: A VINHA (ciclo de trabalho agrícola) -->
  <div id="screen-vinha" class="screen content">
    <div id="vinha-container"></div>
    <button class="btn btn-secondary" onclick="goTo('quinta')" data-i18n="nav.voltarQuinta">⬅ Voltar à Quinta</button>
  </div>

  <!-- ECRÃ: PROTEGER A QUINTA (mantido tal como estava; conteúdo gerado por JS) -->
  <div id="screen-proteger" class="screen content">
    <div id="proteger-container"></div>
    <button class="btn btn-secondary" onclick="goTo('quinta')" data-i18n="nav.voltarQuinta">⬅ Voltar à Quinta</button>
  </div>

  <!-- ECRÃ: CRIAR GARRAFA (com pequena sequência narrativa) -->
  <div id="screen-garrafa" class="screen content">
    <div id="garrafa-container"></div>
    <button class="btn btn-secondary" onclick="goTo('quinta')" data-i18n="nav.voltarQuinta">⬅ Voltar à Quinta</button>
  </div>

  <!-- ECRÃ: EXPLORAR (desbloqueia uma entrada da Enciclopédia de cada vez) -->
  <div id="screen-explorar" class="screen content">
    <div id="explorar-container"></div>
    <button class="btn btn-secondary" onclick="goTo('quinta')" data-i18n="nav.voltarQuinta">⬅ Voltar à Quinta</button>
  </div>

  <!-- ECRÃ: ENCICLOPÉDIA DO MOSCATEL (galeria de entradas desbloqueadas/bloqueadas) -->
  <div id="screen-enciclopedia" class="screen content">
    <div id="enciclopedia-container"></div>
